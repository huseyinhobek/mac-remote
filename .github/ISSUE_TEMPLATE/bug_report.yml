name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you sent to the bot, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines from logs/mac-remote.log. Remove anything private first.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.2, MacBook Air M2
    validations:
      required: true
